[graph]
all-features = true

[advisories]
version = 2
yanked = "deny"
# Unmaintained crates that only reach us through dioxus-desktop; nothing to upgrade to until it does.
ignore = [
    { id = "RUSTSEC-2024-0370", reason = "proc-macro-error, via the GTK3 bindings (glib-macros)" },
    { id = "RUSTSEC-2024-0436", reason = "paste, via image (exr, pulp)" },
    { id = "RUSTSEC-2025-0057", reason = "fxhash, via wry's HTML parser (kuchikiki, selectors)" },
]

[licenses]
version = 2
confidence-threshold = 0.9
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "CC0-1.0",
    "CDLA-Permissive-2.0",
    "ISC",
    "MIT",
    # File-level copyleft, fine for unmodified dependencies: wry's cssparser and directories' option-ext.
    "MPL-2.0",
    # Permissive; libfuzzer-sys, via image's AVIF encoder (rav1e).
    "NCSA",
    "Unicode-3.0",
    "Zlib",
]

[licenses.private]
ignore = true

[bans]
multiple-versions = "allow"
wildcards = "deny"
# The workspace crates depend on each other by path and are never published.
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
