name: Docs

# Builds the documentation site (MkDocs) on every change, failing on warnings. Publishing it to
# GitHub Pages comes once Pages is enabled for the repository.
on:
  push:
    branches: [main]
  pull_request:
    # Draft PRs run nothing; marking one ready for review runs the checks.
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    if: ${{ !github.event.pull_request.draft }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
      - run: uvx --with-requirements docs/requirements.txt mkdocs build --strict
        env:
          NO_MKDOCS_2_WARNING: "true" # MkDocs is pinned below 2.0 in docs/requirements.txt
