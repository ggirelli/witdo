[package]
name = "witdo-desktop"
description = "witdo: a calm, private, local-first task manager"
version.workspace = true
edition.workspace = true
repository.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
dioxus.workspace = true
tokio = { version = "1", default-features = false, features = ["sync"] }
witdo-app.workspace = true

[lints]
workspace = true

[[bin]]
name = "witdo"
path = "src/main.rs"

[dev-dependencies]
dioxus-ssr = "0.7"
tempfile = "3"
